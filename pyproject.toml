[project]
name = "zbmath"
version = "0.1.0"
description = "zbMATH Open's knowledge graph as typed, sliceable Parquet tables"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "rapidgzip>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zbmath"]

[tool.uv]
package = true

[project.scripts]
decoder-parity = "zbmath.decode:run_parity"
